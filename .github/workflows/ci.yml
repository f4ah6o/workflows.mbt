name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          # pinned toolchain — see .moonbit-toolchain.json
          version: "0.1.20260920"
          core-version: "0.10.14+7d59c7ec9"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host dependencies
        run: npm ci --no-audit --no-fund

      - name: MoonBit check
        run: npm run check:moon

      - name: Build MoonBit JS kernel
        run: npm run build:core

      - name: MoonBit tests
        run: npm run test:moon

      - name: Compatibility host tests
        run: npm run test:host

      - name: Durable process E2E
        run: npm run test:e2e
      - name: Pinned Cloudflare compatibility oracle
        run: npm run compat:pinned

      - name: Generate compatibility report
        if: always()
        run: npm run compat:report

      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-pinned
          path: compat-results/
