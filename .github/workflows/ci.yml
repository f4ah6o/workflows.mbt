name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devin
          POSTGRES_PASSWORD: devin
          POSTGRES_DB: workflows_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devin -d workflows_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          # binaries CDN only serves channel names; check:toolchain enforces
          # the pin recorded in .moonbit-toolchain.json
          version: "latest"
          core-version: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify toolchain pin
        run: npm run check:toolchain

      - name: Install host dependencies
        run: npm ci --no-audit --no-fund

      - name: MoonBit check
        run: npm run check:moon

      - name: Build MoonBit JS kernel
        run: npm run build:core

      - name: MoonBit tests
        run: npm run test:moon

      - name: Compatibility host tests
        run: npm run test:host

      # Shared storage contract + runtime suite; PostgreSQL runs against the
      # service container, SQLite always. Skips Postgres cleanly when the env
      # var is unset.
      - name: Storage contract tests
        run: npm run test:storage
        env:
          WORKFLOWS_POSTGRES_URL: postgres://devin:devin@localhost:5432/workflows_test

      - name: Compatibility probe-client tests
        run: npm run test:compat

      # Fault-injection suite for the upstream-tracking machinery: shared
      # candidate binding, verdict classification, drift dedup/state, publish
      # outcomes, and update-candidate promotion rules — all hermetic.
      - name: Upstream-ops fault-injection tests
        run: npm run test:upstream-ops

      - name: Durable process E2E
        run: npm run test:e2e

      # The packaged artifact must work on a clean consumer machine: no
      # checkout, no MoonBit toolchain, production deps only.
      - name: Clean-consumer artifact smoke test
        run: npm run test:consumer

      # The practical vertical: external side effect (retried, then killed
      # after the effect was applied but before commit), waitForEvent
      # (killed while parked), restart, and completion with exactly one
      # downstream-applied record keyed by the business idempotency key.
      - name: Clean-consumer practical scenario
        run: npm run test:scenario

      - name: Pinned Cloudflare compatibility oracle
        run: npm run compat:pinned

      - name: Generate compatibility report
        if: always()
        run: npm run compat:report

      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-pinned
          path: compat-results/
