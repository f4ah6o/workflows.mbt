name: compatibility-latest

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "compat/**"
      - "package.json"
      - ".github/workflows/compat-latest.yml"

permissions:
  contents: read

jobs:
  compat-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build MoonBit JS kernel
        run: npm run build:core

      - name: Check latest Cloudflare oracle
        run: npm run compat:latest

      - name: Generate compatibility report
        if: always()
        run: npm run compat:report

      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-latest
          path: compat-results/
