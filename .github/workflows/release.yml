name: release

# Versioned, reproducible emergency artifact. Tag `v*` builds the runtime from
# the committed lockfile + pinned MoonBit toolchain, verifies it with the
# fallback drill, and publishes a GitHub Release whose metadata identifies the
# commit, toolchain, oracle date, upstream versions, and known differences.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Release verification consumes the vendored toolchain release, not the
      # moving `latest` channel: install-toolchain.mjs downloads the tarballs
      # recorded in .moonbit-toolchain.json from this repo's toolchain/* tag
      # and verifies their sha256 before extracting.
      - name: Install pinned MoonBit toolchain
        run: node scripts/install-toolchain.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MoonBit JS kernel
        run: npm run build:core

      - name: Host tests
        run: npm run test:host

      # The tarball is named and versioned from package.json, not the tag —
      # fail here if a forgotten version bump would publish e.g. v0.2.0
      # containing @f4ah6o/workflows-mbt@0.1.0.
      - name: Verify tag matches package version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      # The artifact is the `npm pack` tarball — the exact file a consumer
      # installs. `files` in package.json whitelists the runtime contents;
      # prepack stages npm-shrinkwrap.json so extracted consumers can run
      # `npm ci --omit=dev` deterministically.
      - name: Package emergency artifact
        run: |
          mkdir -p release
          npm pack --pack-destination release
          ls -la release/

      # Verify the artifact the way a consumer uses it: clean directory,
      # production deps, no MoonBit toolchain, doctor + dev + SIGKILL
      # mid-suspension + restart from persisted state, plus an
      # `npm install <tarball>` bin check. See scripts/consumer-smoke.mjs.
      - name: Verify artifact with clean-consumer smoke test
        run: node scripts/consumer-smoke.mjs --tarball release/*.tgz

      # Keep the fallback drill record against the extracted artifact so the
      # release metadata carries a drill provenance record.
      - name: Verify artifact with fallback drill
        run: |
          mkdir -p /tmp/artifact-verify
          tar -xzf release/*.tgz -C /tmp/artifact-verify
          cd /tmp/artifact-verify/package
          npm ci --omit=dev --no-audit --no-fund
          node compat/run-drill.mjs --skip-cloudflare

      - name: Write release metadata
        run: |
          node scripts/write-release-metadata.mjs \
            --drill /tmp/artifact-verify/package/compat-results/drill-latest.json \
            > release/metadata.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tgz \
            release/metadata.json \
            --title "workflows.mbt ${GITHUB_REF_NAME}" \
            --notes-file release/metadata.json
