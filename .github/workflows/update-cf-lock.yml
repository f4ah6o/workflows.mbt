name: update cf migration lock

on:
  push:
    branches: [feat/migrate-wrangler-to-cf]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrate-wrangler-to-cf
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Update npm shrinkwrap
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit shrinkwrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json npm-shrinkwrap.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore: update cf migration shrinkwrap"
            git push origin HEAD:feat/migrate-wrangler-to-cf
          fi
